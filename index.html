<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Moringa School Library</h1>
    </header>
    <section id="search section">
        <h2>Find a book</h2>
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Enter book title or author">
            <button type="submit">Search</button>
        </form>
        <div id="search-results"></div>
    </section>
    <section id="add-book-section">
        <h2>Add a New Book</h2>
        <form id="add-book-form">
            <input type="text" id="book-title" placeholder="Book Title" required>
            <input type="text" id="book-author" placeholder="Author" required>
            <input type="text" id="book-isbn" placeholder="ISBN" required>
            <button type="submit">Add Book</button>
        </form>
        <div id="add-book-message"></div>
    </section>
    <section id="book-list-section">
        <h2>Book List</h2>
        <ul id="book-list"></ul>
